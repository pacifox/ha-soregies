[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # Les libellés et messages destinés à l'utilisateur sont en français :
  # RUF001/002/003 signalent les caractères Unicode ambigus (apostrophe
  # typographique, espace insécable), qui sont ici volontaires.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
